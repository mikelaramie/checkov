substitutions:
  _APPLY: "false"
  _CHECKOV_IMAGE: "bridgecrew/checkov:3.3.11"

steps:
  - id: terraform-init
    name: hashicorp/terraform:1.9
    entrypoint: sh
    args:
      - -c
      - |
        set -euo pipefail
        cd terraform/environments/dev
        terraform init -input=false

  - id: terraform-plan
    name: hashicorp/terraform:1.9
    entrypoint: sh
    args:
      - -c
      - |
        set -euo pipefail
        cd terraform/environments/dev
        terraform plan -input=false -out=tfplan
        terraform show -json tfplan > tfplan.json
    waitFor:
      - terraform-init

  - id: checkov
    name: ${_CHECKOV_IMAGE}
    args:
      - -f
      - terraform/environments/dev/tfplan.json
      - --framework
      - terraform_plan
    waitFor:
      - terraform-plan

  - id: terraform-apply
    name: hashicorp/terraform:1.9
    entrypoint: sh
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_APPLY}" != "true" ]; then
          echo "Skipping apply (plan-only pipeline)."
          exit 0
        fi
        cd terraform/environments/dev
        terraform apply -input=false -auto-approve tfplan
    waitFor:
      - checkov

options:
  logging: CLOUD_LOGGING_ONLY
