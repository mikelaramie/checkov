# Lives at the root of mikelaramie/checkov. Substitutions are set by the
# checkov-image Cloud Build trigger in terraform/bootstrap.
timeout: 3600s

steps:
  - id: docker-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_AR_HOSTNAME}/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:${COMMIT_SHA}
      - -t
      - ${_AR_HOSTNAME}/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:latest
      - .

  - id: docker-push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_AR_HOSTNAME}/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}
    waitFor:
      - docker-build

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

substitutions:
  _AR_HOSTNAME: us-central1-docker.pkg.dev
  _AR_REPO: checkov
  _IMAGE: checkov